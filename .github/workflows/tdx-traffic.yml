name: Update Nationwide TDX Traffic
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/fetch_tdx_traffic.py"
      - ".github/workflows/tdx-traffic.yml"
permissions:
  contents: write
concurrency:
  group: tdx-api-global
  cancel-in-progress: false
jobs:
  update-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # VD 與一般道路路況維持同一工作流序列執行；共用 TDX API 限流保護，避免並行請求觸發 429。
      - name: Refresh nationwide VD live data first
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python scripts/fetch_tdx_traffic.py --vd-only
      - name: Publish VD snapshot before road network refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_DIR="$(mktemp -d)"
          cp data/tdx-vd.json "$DATA_DIR/"
          cp data/tdx-vd-static-cache.json "$DATA_DIR/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if [ -f data/tdx-vd.json ]; then
              if python - "$DATA_DIR/tdx-vd.json" data/tdx-vd.json <<'PY'
          import json, sys
          from datetime import datetime, timezone
          def stamp(path):
              with open(path, encoding="utf-8") as f:
                  value = json.load(f).get("generatedAt")
              if not value:
                  return None
              parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              return parsed if parsed.tzinfo else parsed.replace(tzinfo=timezone.utc)
          candidate, published = map(stamp, sys.argv[1:3])
          if candidate is None:
              raise SystemExit("Candidate VD snapshot has no generatedAt timestamp")
          if published is not None and published > candidate:
              print("A newer VD snapshot is already published; keeping it.")
              raise SystemExit(10)
          PY
              then
                :
              else
                status=$?
                if [ "$status" -eq 10 ]; then exit 0; fi
                exit "$status"
              fi
            fi
            cp "$DATA_DIR/tdx-vd.json" data/
            cp "$DATA_DIR/tdx-vd-static-cache.json" data/
            git add data/tdx-vd.json data/tdx-vd-static-cache.json
            if git diff --cached --quiet; then
              echo "VD snapshot unchanged."
              exit 0
            fi
            git commit -m "Refresh nationwide TDX VD live data"
            if git push origin HEAD:main; then
              echo "VD snapshot published before road refresh."
              exit 0
            fi
            sleep 2
          done
          echo "Unable to publish VD snapshot after 3 attempts."
          exit 1
      - name: Fetch nationwide official TDX traffic
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python scripts/fetch_tdx_traffic.py --skip-vd
      - name: Commit refreshed traffic JSON
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve this run's freshly fetched data while syncing the latest main.
          DATA_DIR="$(mktemp -d)"
          cp data/tdx-traffic.json "$DATA_DIR/"
          cp data/tdx-shapes-cache.json "$DATA_DIR/"
          cp data/tdx-congestion-definitions.json "$DATA_DIR/"
          cp data/tdx-layers.json "$DATA_DIR/"
          cp data/tdx-layers-cache.json "$DATA_DIR/"

          for attempt in 1 2 3; do
            echo "Sync and push attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data

            # Never replace a newer published snapshot with an older run.
            if [ -f data/tdx-traffic.json ]; then
              if python - "$DATA_DIR/tdx-traffic.json" data/tdx-traffic.json <<'PY'
          import json, sys
          from datetime import datetime

          def stamp(path):
              with open(path, encoding="utf-8") as f:
                  value = json.load(f).get("generatedAt")
              if not value:
                  return None
              parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=__import__("datetime").timezone.utc)
              return parsed

          candidate, published = map(stamp, sys.argv[1:3])
          if candidate is None:
              raise SystemExit("Candidate snapshot has no generatedAt timestamp")
          if published is not None and published > candidate:
              print(f"Skip stale snapshot: candidate={candidate.isoformat()} published={published.isoformat()}")
              raise SystemExit(10)
          PY
              then
                :
              else
                status=$?
                if [ "$status" -eq 10 ]; then
                  echo "A newer traffic snapshot is already published; keeping it."
                  exit 0
                fi
                exit "$status"
              fi
            fi

            cp "$DATA_DIR/tdx-traffic.json" data/
            cp "$DATA_DIR/tdx-shapes-cache.json" data/
            cp "$DATA_DIR/tdx-congestion-definitions.json" data/
            cp "$DATA_DIR/tdx-layers.json" data/
            cp "$DATA_DIR/tdx-layers-cache.json" data/

            # Stage refreshed files before checking whether there are changes.
            git add data/tdx-traffic.json data/tdx-shapes-cache.json data/tdx-congestion-definitions.json data/tdx-layers.json data/tdx-layers-cache.json

            if git diff --cached --quiet; then
              echo "No traffic data changes."
              exit 0
            fi

            git commit -m "Update nationwide TDX traffic data"
            if git push origin HEAD:main; then
              echo "Traffic data pushed successfully."
              exit 0
            fi

            echo "Push raced with another main update; will fetch latest and retry."
            sleep 2
          done

          echo "Unable to push traffic data after 3 synchronized attempts."
          exit 1
